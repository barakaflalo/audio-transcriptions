:root{

}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);

body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
button{font-family:inherit; cursor:pointer;}
button:disabled{cursor:not-allowed;opacity:.5}button,input,select,textarea,[tabindex]{touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold)!important;outline-offset:3px!important;}
.skip-link{position:fixed;top:-80px;inset-inline-start:12px;z-index:200;background:var(--gold);color:#111;padding:12px 16px;border-radius:10px;font-weight:700}.skip-link:focus{top:12px}
.app{max-width:680px;margin:0 auto;padding:18px 18px 90px;}
/* Header */

.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.brand .logo{width:38px;height:38px;flex:none;}
.brand h1{font-size:20px;margin:0;letter-spacing:.5px;}
.brand .tag{font-size:11px;color:var(--muted);margin:0;}
.dot{width:11px;height:11px;border-radius:50%;background:var(--danger);flex:none;
  box-shadow:0 0 0 3px rgba(0,0,0,.4);} 
.dot.on{background:var(--ok);}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);color:var(--text);font-size:18px;display:flex;
  align-items:center;justify-content:center;flex:none;}
/* Cards / tiles */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;}
.section-card>summary{cursor:pointer;list-style:none;font-size:16px;font-weight:750;display:flex;align-items:center;gap:8px}.section-card>summary::-webkit-details-marker{display:none}.section-card>summary::after{content:'＋';margin-inline-start:auto;color:var(--gold);font-size:20px}.section-card[open]>summary::after{content:'−'}.section-card[open]>summary{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo-fallback{display:none;width:38px;height:38px;border:2px solid var(--gold);border-radius:12px;color:var(--gold);align-items:center;justify-content:center;font-weight:800}.logo-fallback.big{width:72px;height:72px;border-radius:20px;font-size:25px;margin:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 14px;text-align:center;color:var(--text);min-height:104px;

  transition:transform .12s ease,border-color .12s ease;}
.tile:active{transform:scale(.97);}
.tile .emo{font-size:26px;}
.tile .lbl{font-size:14px;font-weight:600;}
.tile.wide{grid-column:1 / -1;border-color:var(--gold);}
.tile.wide .emo{font-size:30px;}
/* Buttons */
.btn{display:block;width:100%;min-height:var(--tap);border-radius:14px;font-size:16px;
  font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);
  padding:12px;margin-top:10px;}
.btn.primary{background:transparent;border:1.5px solid var(--gold);color:var(--gold);}
.btn.gold{background:var(--gold);border:1.5px solid var(--gold);color:#111;}
.btn.ghost{background:transparent;}
.btn.danger{border-color:var(--danger);color:var(--danger);}
.btn:active{transform:scale(.99);}
.btn.sm{min-height:44px;font-size:14px;padding:8px 12px;margin-top:0;width:auto;display:inline-block;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row .btn{flex:1;margin-top:0;}
.back{display:inline-flex;align-items:center;gap:8px;background:var(--card);

  font-size:15px;font-weight:600;margin-bottom:14px;min-height:46px;}
.back{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25)}

input,select,textarea{width:100%;background:#0e0e0e;border:1px solid var(--line);

input[type=file]::file-selector-button{background:var(--card);color:var(--text);border:1px solid var(--gold);border-radius:9px;padding:9px 12px;margin-inline-end:10px;font-family:inherit;font-weight:650;cursor:pointer}
.reading-text,#resText,#mEdit{font-size:var(--reader-size,16px);line-height:var(--reader-line,1.7);}
.reading-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto;padding:8px 2px;}
#printRoot{display:none}
audio,video{width:100%;margin-top:10px;border-radius:12px;background:#080808;max-height:300px;}
.segment-list{max-height:260px;overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px;padding:6px}.segment{display:flex;gap:10px;width:100%;text-align:start;border:0;border-radius:9px;padding:9px;background:transparent;color:var(--text);cursor:pointer}.segment:hover,.segment.active{background:rgba(212,175,55,.16)}.segment-time{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}.segment-text{flex:1}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
.hint a{color:var(--gold);}
.h2{font-size:16px;font-weight:700;margin:2px 0 4px;}
.sub{font-size:13px;color:var(--muted);margin:0 0 8px;}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;

.pill.free{color:var(--ok);border-color:var(--ok);}
.pill.api{color:var(--gold);border-color:var(--gold-soft);}
.pill.local{color:#7aa6d6;border-color:#476b91;}
.prov{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#0e0e0e;}
.prov.sel{border-color:var(--gold);background:#171307;}
.prov .name{font-weight:600;font-size:15px;}
/* transcript list */
.tr{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#0e0e0e;}
.tr .meta{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;}
.tr .snip{font-size:14px;line-height:1.5;max-height:60px;overflow:hidden;}
.tr .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.tr .tr-title{font-size:16px;font-weight:700;margin-bottom:5px;overflow-wrap:anywhere;}
.library-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.library-controls .search{grid-column:1/-1;}
.statusrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.statusrow:last-child{border-bottom:0;}.statusvalue{font-weight:700;text-align:end;}

.muted{color:var(--muted);}
.small{font-size:12px;}
.disc{font-size:11px;color:var(--muted);text-align:center;line-height:1.6;margin-top:6px;}
.badge{text-align:center;font-size:11px;color:var(--muted);margin-top:18px;}

.progress{height:8px;background:#1c1c1c;border-radius:20px;overflow:hidden;margin:10px 0;}

@keyframes load{0%{margin-inline-start:-30%}100%{margin-inline-start:100%}}
.hidden{display:none !important;}
.screen{animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.light-theme{--bg:#f4f1e9;--card:#fff;--line:#e0dccb;--text:#1c1a15;--muted:#7a7568;}

.seg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;}

.seg button.on{border-color:var(--gold);color:var(--gold);}

function subtitleSeconds(value){
  const p=String(value||'').trim().replace(',','.').split(':').map(Number);if(p.some(n=>!Number.isFinite(n)))return NaN;

function parseTranscriptDocument(raw,name){
  const source=String(raw||'').replace(/^\uFEFF/,'').replace(/\r/g,'');
  if(/\.txt$/i.test(name))return {text:source.trim(),segments:null};
  const blocks=source.replace(/^WEBVTT[^\n]*\n/i,'').split(/\n{2,}/),segments=[];
  for(const block of blocks){const lines=block.split('\n');const ti=lines.findIndex(l=>l.includes('-->'));if(ti<0)continue;
    const times=lines[ti].split('-->');const start=subtitleSeconds(times[0]),end=subtitleSeconds((times[1]||'').trim().split(/\s+/)[0]);

}

function friendlyError(err){

  if((err&&err.name==='AbortError')||/abort/.test(m)) return abortReason==='timeout'?T('timed_out'):T('cancelled');
  if(/\b(401|403)\b|api.?key|unauthor|permission/.test(m)) return T('bad_key');
  if(/\b429\b|quota|rate.?limit/.test(m)) return T('quota_err');
  if(/\b413\b|too large|payload/.test(m)) return T('file_too_large');
  if(/unsupported|mime|format|decode/.test(m)) return T('bad_type');
  if(err instanceof TypeError||/failed to fetch|network/.test(m)) return T('network_err');
  return err&&err.message?err.message:T('err');
}

function toggleLive(force=false,resume=false){
  if(S.micEnabled===false){ toast(T('mic_disabled')); go('settings'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast(T('nomic')); return; }
  const btn=document.getElementById('recBtn'),pauseBtn=document.getElementById('pauseRecBtn');
  if(recActive){recPaused=false;recStopRequested=true;setRecStatus(T('recording_stopped'));recog && recog.stop();return;}
  if(!force&&current&&current.dirty&&current.text){ confirmBox(T('replace_draft_q'),()=>{clearCurrent();toggleLive(true);},T('startrec')); return; }
  const srcSel=document.getElementById('srcLang'); const lc=srcSel?srcSel.value:'he';
  if(lc==='auto'){ toast(T('choose_live_lang')); return; }
  if(!resume){liveFinalText='';recElapsedMs=0;recRestartCount=0;}
  recStopRequested=false;recFatalError=false;if(recRestartTimer){clearTimeout(recRestartTimer);recRestartTimer=null;}
  recog = new SR();
  recog.lang = lc==='he'?'he-IL':lc==='ar'?'ar-SA':lc==='ru'?'ru-RU':lc==='es'?'es-ES':lc;
  recog.continuous=true; recog.interimResults=true;
  recog.onstart=()=>startRecTimer();
  recog.onresult=(e)=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) liveFinalText+=t+' '; else interim+=t;
    }
    showLiveResult(liveFinalText, interim);
  };
  recog.onerror=(e)=>{stopRecTimer();recFatalError=['not-allowed','service-not-allowed','audio-capture'].includes(e.error);setRecStatus(`${T('err')}: ${e.error}`);if(recFatalError)toast(T('err')+': '+e.error);};
  recog.onend=()=>{stopRecTimer();recActive=false;if(recPaused){setRecStatus(`⏸ ${T('recording_paused')} · ${T('live_elapsed')}: ${liveClock(recElapsedMs/1000)}`);if(btn)btn.disabled=true;return;}
    if(!recStopRequested&&!recFatalError&&recRestartCount<3){recRestartCount++;setRecStatus(`↻ ${T('reconnecting_rec')} (${recRestartCount}/3)`);if(btn)btn.disabled=true;if(pauseBtn){pauseBtn.disabled=true;pauseBtn.style.opacity='.45';}recRestartTimer=setTimeout(()=>{recRestartTimer=null;toggleLive(true,true);},800);return;}
    if(!document.getElementById('recStatus')?.textContent.startsWith(T('err')))setRecStatus(`${T('recording_stopped')} · ${T('live_elapsed')}: ${liveClock(recElapsedMs/1000)}`);if(btn){btn.disabled=false;btn.textContent=`🎙️ ${T('startrec')}`;btn.classList.remove('danger');btn.classList.add('gold');}if(pauseBtn){pauseBtn.disabled=true;pauseBtn.style.opacity='.45';pauseBtn.textContent=`⏸ ${T('pause_rec')}`;} };
  try{recog.start();recActive=true;setRecStatus(T('mic_waiting'));}
  catch(e){stopRecTimer();recActive=false;recPaused=false;setRecStatus(`${T('err')}: ${e.message||e.name}`);if(btn){btn.disabled=false;btn.textContent=`🎙️ ${T('startrec')}`;}if(pauseBtn){pauseBtn.disabled=true;pauseBtn.style.opacity='.45';pauseBtn.textContent=`⏸ ${T('pause_rec')}`;}toast(T('err'));return;}
  btn.innerHTML=`<span class="rec"></span>${T('recording')} · ${T('stoprec')}`;
  btn.classList.remove('gold'); btn.classList.add('danger');
  btn.disabled=false;if(pauseBtn){pauseBtn.disabled=false;pauseBtn.style.opacity='';pauseBtn.textContent=`⏸ ${T('pause_rec')}`;}
}

function addBatchFiles(files){for(const file of files){const fp=fileFingerprint(file),existing=batchQueue.find(j=>j.fingerprint===fp);if(existing&&existing.status==='needs_file'){existing.file=file;existing.status='queued';existing.error='';continue;}if(existing||transcripts.some(t=>t.sourceFingerprint===fp)){toast(T('duplicate_file'));continue;}batchQueue.push({id:Date.now()+Math.random().toString(36).slice(2,7),name:file.name,size:file.size,lastModified:file.lastModified||0,type:file.type||'',fingerprint:fp,status:'queued',error:'',file});}persistBatchQueue();renderBatchQueue();}

async function startBatchQueue(consented=false){if(batchRunning||activeController)return;if(navigator.onLine===false){toast(T('offline_banner'));return;}const p=fileEngine(),batchLang=document.getElementById('srcLang')?.value||S.lang;if(!p){toast(T('file_needs_key'));go('ai');return;}if(!S.ai.keys[p]&&p!=='custom'){toast(T('need_key'));go('ai');return;}if(!consented&&!ensureProviderConsent(p,'audio',()=>startBatchQueue(true)))return;batchRunning=true;batchStop=false;renderBatchQueue();

async function runTranscription(force=false){
  const srcLang=document.getElementById('srcLang').value;
  const wa=document.getElementById('workArea');
  if(activeController){ toast(T('transcribing')); return; }
  if(navigator.onLine===false){logDiagnostic('transcription_offline');toast(T('offline_banner'));return;}
  if(!pickedFile){ toast(T('no_file')); return; }
  if(!force&&current&&current.dirty&&current.text){ confirmBox(T('replace_draft_q'),()=>runTranscription(true),T('transcribe')); return; }
  const p=fileEngine();
  if(!p){ toast(T('file_needs_key')); go('ai'); return; }
  if(!fileTypeOK(pickedFile,p)){ toast(T('bad_type')); return; }
  if(FILE_LIMITS[p]&&pickedFile.size>FILE_LIMITS[p]){ toast(T('file_too_large')+` (${fileLimitMB(p)} MB)`); return; }
  if(!S.ai.keys[p] && p!=='custom'){ toast(T('need_key')); go('ai'); return; }
  if(!ensureProviderConsent(p,'audio',()=>runTranscription(true))) return;

  const signal=beginRequest(p==='gem'&&pickedFile.size>GEM_INLINE_LIMIT?1200000:180000);

    <button class="btn sm danger" id="cancelTrans" style="margin-top:12px">✕ ${T('cancel_job')}</button></div>`;
  startElapsedTimer();
  acquireWakeLock();
  document.getElementById('cancelTrans').onclick=cancelRequest;
  try{
    let res;
    if(p==='gem') res=await transcribeGemini(pickedFile, srcLang, S.wantTs,S.wantSpeakers,signal);
    else if(p==='oai') res=await transcribeOpenAI(pickedFile, srcLang, S.wantTs,signal);
    else if(p==='custom') res=await transcribeCustom(pickedFile, srcLang,signal);
    resultUndoText=null;notesUndoText=null;
    current={ text:res.text.trim(), segments:res.segments||null, lang:srcLang, at:Date.now(), live:false, name:pickedFile.name, dirty:true };
    persistDraft();
    wa.innerHTML = resultCard(current.text);
    wireResult();
  }catch(err){
    logDiagnostic('transcription_failed',err);
    wa.innerHTML=`<div class="card"><div class="h2" style="color:var(--danger)">${T('err')}</div>
      <p class="hint">${esc(friendlyError(err))}</p><button class="btn sm" id="retryTrans">↻ ${T('retry')}</button></div>`;
    document.getElementById('retryTrans').onclick=()=>runTranscription(true);
  }finally{wa.setAttribute('aria-busy','false');stopElapsedTimer();finishRequest();releaseWakeLock(); const goButton=document.getElementById('goBtn'); if(goButton) goButton.disabled=false; }
}

function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(r.result.split(',')[1]); r.onerror=()=>rej(new Error('read failed')); r.readAsDataURL(file); }); }

/* ---------- Gemini model handling (fallback + live list) ---------- */
const GEM_DEFAULT='gemini-3.6-flash';
const GEM_FALLBACKS=['gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite','gemini-3-flash-preview'];
function geminiCandidates(){
  const first=(S.ai.models&&S.ai.models.gem)||GEM_DEFAULT;
  return [...new Set([first, ...GEM_FALLBACKS])];
}
async function geminiGenerate(key, body,signal){
  let lastErr;
  for(const model of geminiCandidates()){
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal});
    if(r.ok){
      const data=await r.json();
      return (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n').trim();
    }
    const errText=(await r.text()).slice(0,300);
    lastErr=new Error('Gemini '+r.status+': '+errText);
    // model gone/unavailable → try the next candidate; any other error → stop now
    if(!(r.status===404 || r.status===400 && /not\s*(found|available|supported)|no longer available/i.test(errText))) throw lastErr;
  }
  throw lastErr||new Error('Gemini: no available model');
}
async function transcribeGemini(file, lang, wantTs,wantSpeakers,signal){
  const key=S.ai.keys.gem;
  const langName = lang==='auto'?'the spoken language':(LANGOPTS.find(o=>o[0]===lang)||[,lang])[1];
  const prompt = wantTs
    ? `Transcribe this audio verbatim in ${langName}. Return ONLY a JSON array of segments, no markdown, each like {"start":<seconds>,"end":<seconds>,"text":"..."${wantSpeakers?',"speaker":"Speaker 1"':''}}. Keep segments short (one sentence). ${wantSpeakers?'Identify speaker changes consistently; do not invent personal names unless clearly spoken.':''}`
    : `Transcribe this audio verbatim in ${langName}. Return ONLY the transcript text, no comments.`;
  let uploaded=null,cache=null,part,completed=false;
  try{
    if(file.size>GEM_INLINE_LIMIT){
      if(geminiRetryUpload&&geminiRetryUpload.file===file&&geminiRetryUpload.key===key){cache=geminiRetryUpload;if(cache.timer)clearTimeout(cache.timer);cache.timer=null;uploaded=cache.resource;setTranscriptionPhase(T('reuse_upload'));}
      else{clearGeminiRetryUpload();uploaded=await uploadGeminiFile(file,key,signal);cache=geminiRetryUpload={file,key,resource:uploaded,timer:null};}
      part={file_data:{mime_type:uploaded.mimeType,file_uri:uploaded.uri}};
    }
    else{const b64=await fileToBase64(file);part={inline_data:{mime_type:file.type||'audio/mpeg',data:b64}};}
    setTranscriptionPhase(T('sending_provider'));
    const body={contents:[{parts:[{text:prompt},part]}]};
    const txt=await geminiGenerate(key,body,signal);
    completed=true;
    if(wantTs){const segs=parseSegments(txt);return {text:segs.map(s=>s.text).join(' '),segments:segs};}
    return {text:txt,segments:null};
  }finally{if(cache){if(completed||signal.aborted)clearGeminiRetryUpload(cache);else holdGeminiRetryUpload(cache);}}
}

function uploadGeminiBytes(url,file,signal){return new Promise((resolve,reject)=>{
  const x=new XMLHttpRequest();x.open('POST',url);x.setRequestHeader('X-Goog-Upload-Offset','0');x.setRequestHeader('X-Goog-Upload-Command','upload, finalize');
  x.upload.onprogress=e=>{if(e.lengthComputable)setTranscriptionPhase(`${T('uploading_long')}: ${Math.round(e.loaded/e.total*100)}%`);};
  x.onload=()=>{if(x.status>=200&&x.status<300){try{resolve(JSON.parse(x.responseText));}catch(e){reject(e);}}else reject(new Error('Gemini upload '+x.status));};x.onerror=()=>reject(new Error('Gemini upload network'));x.onabort=()=>reject(new DOMException('Aborted','AbortError'));
  const abort=()=>x.abort();signal.addEventListener('abort',abort,{once:true});x.onloadend=()=>signal.removeEventListener('abort',abort);x.send(file);
});}
function waitSignal(ms,signal){return new Promise((resolve,reject)=>{const abort=()=>{clearTimeout(id);reject(new DOMException('Aborted','AbortError'));};const id=setTimeout(()=>{signal.removeEventListener('abort',abort);resolve();},ms);signal.addEventListener('abort',abort,{once:true});});}
async function uploadGeminiFile(file,key,signal){
  setTranscriptionPhase(`${T('uploading_long')}: 0%`);const mime=file.type||'audio/mpeg';
  const start=await fetch('https://generativelanguage.googleapis.com/upload/v1beta/files',{method:'POST',signal,headers:{'x-goog-api-key':key,'X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start','X-Goog-Upload-Header-Content-Length':String(file.size),'X-Goog-Upload-Header-Content-Type':mime,'Content-Type':'application/json'},body:JSON.stringify({file:{display_name:file.name||'TimlulAI media'}})});
  if(!start.ok)throw new Error('Gemini upload start '+start.status);const url=start.headers.get('x-goog-upload-url');if(!url)throw new Error('Gemini upload URL missing');
  const result=await uploadGeminiBytes(url,file,signal);let resource=result.file;if(!resource||!resource.name||!resource.uri)throw new Error('Gemini upload response');
  try{for(let i=0;i<150&&resource.state&&resource.state!=='ACTIVE';i++){if(resource.state==='FAILED')throw new Error('Gemini file processing failed');setTranscriptionPhase(T('processing_media'));await waitSignal(2000,signal);const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/${resource.name}`,{signal,headers:{'x-goog-api-key':key}});if(!r.ok)throw new Error('Gemini file status '+r.status);resource=await r.json();}
    if(resource.state&&resource.state!=='ACTIVE')throw new Error('Gemini file processing timeout');return {name:resource.name,uri:resource.uri,mimeType:resource.mime_type||mime};
  }catch(e){fetch(`https://generativelanguage.googleapis.com/v1beta/${resource.name}`,{method:'DELETE',keepalive:true,headers:{'x-goog-api-key':key}}).catch(()=>{});throw e;}
}

async function transcribeOpenAI(file, lang, wantTs,signal){
  const key=S.ai.keys.oai;
  const model = wantTs ? 'whisper-1' : (S.ai.models.oai||'gpt-transcribe');
  const fd=new FormData(); fd.append('file', file); fd.append('model', model);
  if(lang && lang!=='auto') fd.append('language', lang);
  fd.append('response_format', wantTs ? 'verbose_json' : 'json');
  setTranscriptionPhase(T('sending_provider'));
  const r=await fetch('https://api.openai.com/v1/audio/transcriptions',{
    method:'POST', headers:{'Authorization':'Bearer '+key}, body:fd, signal });
  if(!r.ok){ throw new Error('OpenAI '+r.status+': '+(await r.text()).slice(0,200)); }
  const data=await r.json();
  if(wantTs && data.segments){
    const segs=data.segments.map(s=>({start:s.start,end:s.end,text:(s.text||'').trim()}));
    return { text:data.text||segs.map(s=>s.text).join(' '), segments:segs };
  }
  return { text:data.text||'', segments:null };
}

async function transcribeCustom(file, lang,signal){
  const base=safeBaseUrl(S.ai.base||'http://localhost:11434');

  const data=await r.json();
  return { text:data.text||'', segments:null };
}

function parseSegments(txt){
  let t=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
  try{ const arr=JSON.parse(t); if(Array.isArray(arr)) return arr.map(s=>({start:+s.start||0,end:+s.end||0,text:(s.text||'').trim(),speaker:String(s.speaker||'').trim().slice(0,80)})); }catch(e){}
  // fallback: no timestamps
  return [{start:0,end:0,text:t}];
}

function renderSegmentEditor(){const x=segmentEditSession;if(!x)return;modal(`<div class="h2">👥 ${T('speakers')}</div><div class="card"><div class="h2">${T('rename_speaker')}</div><div class="row"><input id="speakerOld" placeholder="${T('old_name')}"><input id="speakerNew" placeholder="${T('new_name')}"><button class="btn sm" id="renameSpeaker">${T('apply_name')}</button></div></div><div style="max-height:60vh;overflow:auto">${x.items.map((s,i)=>`<div class="card"><div class="row"><label style="flex:1">${T('speaker')}<input data-seg-field="speaker" data-i="${i}" value="${esc(s.speaker||'')}"></label><label style="flex:1">Start<input type="number" min="0" step="0.1" data-seg-field="start" data-i="${i}" value="${Number(s.start)||0}"></label><label style="flex:1">End<input type="number" min="0" step="0.1" data-seg-field="end" data-i="${i}" value="${Number(s.end)||0}"></label></div><textarea data-seg-field="text" data-i="${i}" style="min-height:90px">${esc(s.text||'')}</textarea><div class="row"><button class="btn sm" data-split="${i}">✂️ ${T('split_segment')}</button><button class="btn sm ghost" data-merge="${i}" ${i===x.items.length-1?'disabled':''}>🔗 ${T('merge_next')}</button></div></div>`).join('')}</div><div class="row"><button class="btn ghost" onclick="segmentEditSession=null;closeModal()">${T('cancel')}</button><button class="btn gold" id="saveSegments">💾 ${T('savehist')}</button></div>`);

/* ---------- assistant (cleanup / summary / translate) uses chat models ---------- */
function setStudyBusy(busy){document.querySelectorAll('[data-study]').forEach(b=>b.disabled=busy);const e=document.getElementById('studyStatus');if(e)e.textContent=busy?T('creating_study'):'';}
async function studyAssist(kind,ta,notes){
  if(studyAssistRunning)return;const text=ta.value.trim();if(!text)return;const prov=S.ai.keys.claude?'claude':S.ai.keys.oai?'oai':S.ai.keys.gem?'gem':null;if(!prov){toast(T('need_key'));return;}if(!ensureProviderConsent(prov,'text',()=>studyAssist(kind,ta,notes)))return;
  const prompts={summary:'Create a concise study summary in the SAME language as the transcript. Use clear headings and bullet points. Return only the study notes:\n\n',points:'Extract the most important facts, arguments, definitions and conclusions in the SAME language as the transcript. Use concise bullet points. Return only the key points:\n\n',questions:'Create useful review questions with short answers based only on the transcript, in the SAME language as the transcript. Return only the questions and answers:\n\n',glossary:'Create a glossary of important terms from the transcript, each with a short explanation, in the SAME language as the transcript. Return only the glossary:\n\n'};
  const headings={summary:T('study_summary'),points:T('key_points'),questions:T('review_questions'),glossary:T('glossary')};studyAssistRunning=true;setStudyBusy(true);
  try{const out=(await callChat(prov,prompts[kind]+text)).trim();if(!out)throw new Error('empty');notesUndoText=notes.value;notes.value=(notes.value.trim()?notes.value.trim()+'\n\n':'')+`## ${headings[kind]}\n${out}`;notes.dispatchEvent(new Event('input'));const undo=document.getElementById('undoNotes');if(undo){undo.disabled=false;undo.style.opacity='';}}
  catch(e){logDiagnostic('study_ai_failed',e);toast(T('err'));}finally{studyAssistRunning=false;setStudyBusy(false);}
}
async function assist(kind, ta){
  const text=ta.value.trim(); if(!text){ return; }
  const prov = S.ai.keys.claude?'claude': S.ai.keys.oai?'oai': S.ai.keys.gem?'gem': null;
  if(!prov){ toast(T('need_key')); return; }
  if(!ensureProviderConsent(prov,'text',()=>assist(kind,ta))) return;
  const prompts={
    cleanup:'Fix punctuation, capitalization and paragraph breaks in this transcript. Keep the SAME language and wording. Return only the corrected text:\n\n',
    summarize:'Summarize the key points of this transcript in the same language, as short bullet points. Return only the summary:\n\n',
    translate:'Translate this transcript to clear English. Return only the translation:\n\n',
  };
  const btnRow=ta.parentElement;
  toast(T('transcribing'));
  try{
    const out=await callChat(prov, prompts[kind]+text);
    resultUndoText=ta.value;
    if(kind==='summarize'||kind==='translate'){
      ta.value = ta.value + '\n\n— — —\n' + out.trim();
    } else { ta.value = out.trim(); }
    const undo=document.getElementById('btnUndo');if(undo){undo.disabled=false;undo.style.opacity='';}
    ta.dispatchEvent(new Event('input'));
    if(current){ current.text=ta.value; current.dirty=true; persistDraft(); }
  }catch(err){logDiagnostic('text_ai_failed',err);toast(T('err')); }
}
async function callChat(prov, userText){
  if(navigator.onLine===false){logDiagnostic('ai_offline');throw new Error('offline');}
  if(prov==='claude'){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.ai.keys.claude,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:S.ai.models.claude||'claude-haiku-4-5-20251001',max_tokens:2000,
        messages:[{role:'user',content:userText}]})});
    if(!r.ok) throw new Error('Claude '+r.status);
    const d=await r.json(); return (d.content||[]).map(c=>c.text||'').join('\n');
  }
  if(prov==='oai'){
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.ai.keys.oai},
      body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:userText}]})});
    if(!r.ok) throw new Error('OpenAI '+r.status);
    const d=await r.json(); return d.choices?.[0]?.message?.content||'';
  }
  // gemini (with model fallback)
  return await geminiGenerate(S.ai.keys.gem, {contents:[{parts:[{text:userText}]}]});
}

/* ---------- subtitle formatting ---------- */
function ts(t, comma){ t=Math.max(0,t||0); const h=Math.floor(t/3600), m=Math.floor(t%3600/60),
  s=Math.floor(t%60), ms=Math.round((t-Math.floor(t))*1000);
  const p=(n,l=2)=>String(n).padStart(l,'0');
  return `${p(h)}:${p(m)}:${p(s)}${comma?',':'.'}${p(ms,3)}`; }
function segmentText(s){return `${s.speaker?`${s.speaker}: `:''}${s.text||''}`;}
function transcriptExportText(t){return Array.isArray(t.segments)&&t.segments.some(s=>s.speaker)?t.segments.map(segmentText).join('\n\n'):t.text||'';}
function toSRT(segs){ return segs.map((s,i)=>`${i+1}\n${ts(s.start,true)} --> ${ts(s.end||s.start+2,true)}\n${segmentText(s)}\n`).join('\n'); }
function toVTT(segs){ return 'WEBVTT\n\n'+segs.map(s=>`${ts(s.start)} --> ${ts(s.end||s.start+2)}\n${segmentText(s)}\n`).join('\n'); }
function transcriptMarkdown(t){const title=transcriptTitle(t).replace(/[\r\n]+/g,' ').trim(),dateLabel=S.lang==='he'?'תאריך':'Date',meta=[t.course?`**${T('course_subject')}:** ${t.course}`:'',`**${dateLabel}:** ${fmtDate(t.at||Date.now())}`,`**${T('words')}:** ${transcriptWords(t)}`].filter(Boolean).join('  \n');return `# ${title}\n\n${meta}\n\n${t.notes?`## ${T('study_notes')}\n\n${t.notes}\n\n`:''}## ${T('result')}\n\n${transcriptExportText(t)}\n`;}
function exportFilteredMarkdown(){const list=filteredTranscripts();if(!list.length){toast(T('no_results'));return;}const course=mineState.course!=='all'?mineState.course:'TimlulAI',name=safeFolderPart(course,'transcripts')+'.md';download(name,list.map(transcriptMarkdown).join('\n\n---\n\n'),'text/markdown');}
async function shareTranscript(t){if(!t)return;const title=transcriptTitle(t),text=transcriptMarkdown(t);try{if(navigator.share){await navigator.share({title,text});return;}}catch(e){if(e.name==='AbortError')return;}try{await navigator.clipboard.writeText(text);toast(T('share_fallback'));}catch(e){download(safeFolderPart(title,'transcript')+'.md',text,'text/markdown');}}
function readingMinutes(t){return Math.max(1,Math.ceil(transcriptWords(t)/200));}
function showReadingMode(t){modal(`<div class="h2">📖 ${esc(transcriptTitle(t))}</div><p class="hint">${T('reading_time')}: ${readingMinutes(t)} ${T('minutes')}</p><div class="reading-text">${esc(t.text||'')}</div>${t.notes?`<div class="h2" style="margin-top:18px">${T('study_notes')}</div><div class="reading-text">${esc(t.notes)}</div>`:''}<div class="row" style="margin-top:14px"><button class="btn sm" id="readPrint">🖨️ ${T('print_pdf')}</button><button class="btn ghost" onclick="closeModal()">${T('close')}</button></div>`);document.getElementById('readPrint').onclick=()=>printTranscript(t);}
function printTranscript(t){const root=document.getElementById('printRoot');root.dir=RTL.includes(t.lang||S.lang)?'rtl':'ltr';root.innerHTML=`<h1>${esc(transcriptTitle(t))}</h1>${t.course?`<p>${esc(T('course_subject'))}: ${esc(t.course)}</p>`:''}<p>${esc(fmtDate(t.at||Date.now()))} · ${transcriptWords(t)} ${esc(T('words'))}</p><div class="print-text">${esc(t.text||'')}</div>${t.notes?`<div class="print-notes"><b>${esc(T('study_notes'))}</b><br>${esc(t.notes)}</div>`:''}`;root.hidden=false;const cleanup=()=>{root.hidden=true;root.innerHTML='';window.removeEventListener('afterprint',cleanup);};window.addEventListener('afterprint',cleanup);window.print();}
function duplicateTranscript(id){const t=findTr(id);if(!t)return;const copy={...JSON.parse(JSON.stringify(t)),id:Date.now()+Math.random().toString(36).slice(2,7),title:`${transcriptTitle(t)} - ${T('duplicate')}`,at:Date.now(),favorite:false};delete copy.deviceFile;transcripts.unshift(copy);if(persistTr()){toast(T('duplicated'));render();}}

function download(name, content, type){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=(S.username?S.username+'-':'')+name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000); }

/* ---------- USER-SELECTED DEVICE FOLDER ---------- */
let deviceFolderHandle=null,deviceFolderPermission='none';
function folderDb(){ return new Promise((resolve,reject)=>{ if(!window.indexedDB)return reject(new Error('unsupported'));
  const r=indexedDB.open('timlulai_handles',1);r.onupgradeneeded=()=>r.result.createObjectStore('handles');
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error); }); }
async function storeFolderHandle(handle){const db=await folderDb();return new Promise((res,rej)=>{const tx=db.transaction('handles','readwrite');tx.objectStore('handles').put(handle,'deviceFolder');tx.oncomplete=()=>{db.close();res();};tx.onerror=()=>rej(tx.error);});}
async function readFolderHandle(){try{const db=await folderDb();return await new Promise((res,rej)=>{const tx=db.transaction('handles','readonly'),r=tx.objectStore('handles').get('deviceFolder');r.onsuccess=()=>{db.close();res(r.result||null);};r.onerror=()=>rej(r.error);});}catch(e){return null;}}
async function removeFolderHandle(){try{const db=await folderDb();await new Promise((res,rej)=>{const tx=db.transaction('handles','readwrite');tx.objectStore('handles').delete('deviceFolder');tx.oncomplete=()=>{db.close();res();};tx.onerror=()=>rej(tx.error);});}catch(e){}}
function safeFolderPart(v,fallback){const s=String(v||'').trim().replace(/[\\/:*?"<>|]/g,'-').replace(/[. ]+$/,'').slice(0,80);return s||fallback;}
async function folderPermission(handle,request=false){
  if(!handle)return 'none';try{let state=await handle.queryPermission({mode:'readwrite'});if(state==='prompt'&&request)state=await handle.requestPermission({mode:'readwrite'});return state;}catch(e){return 'denied';}
}
async function getAppDeviceFolder(request=false,userFolderName,create=true){
  if(!deviceFolderHandle)return null;deviceFolderPermission=await folderPermission(deviceFolderHandle,request);if(deviceFolderPermission!=='granted')return null;
  const root=await deviceFolderHandle.getDirectoryHandle('TimlulAI',{create});
  return await root.getDirectoryHandle(userFolderName||safeFolderPart(S.username,S.lang==='he'?'משתמש':'User'),{create});
}
async function connectDeviceFolder(){
  if(!window.showDirectoryPicker){toast(T('unsupported'));return;}
  try{const h=await window.showDirectoryPicker({mode:'readwrite'});deviceFolderHandle=h;deviceFolderPermission=await folderPermission(h,true);
    if(deviceFolderPermission!=='granted')throw new Error('denied');await storeFolderHandle(h);await getAppDeviceFolder(false);toast(T('folder_connected'));refreshDeviceCenter();}
  catch(e){if(e&&e.name!=='AbortError')toast(T('folder_error'));}
}
async function reconnectDeviceFolder(){if(!deviceFolderHandle){connectDeviceFolder();return;}deviceFolderPermission=await folderPermission(deviceFolderHandle,true);if(deviceFolderPermission==='granted')toast(T('folder_connected'));else toast(T('denied'));refreshDeviceCenter();}
async function disconnectDeviceFolder(){await removeFolderHandle();deviceFolderHandle=null;deviceFolderPermission='none';toast(T('folder_disconnected_note'));refreshDeviceCenter();}
async function writeTranscriptToDevice(t,request=false,sourceFile=null){
  try{const folder=safeFolderPart(S.username,S.lang==='he'?'משתמש':'User'),dir=await getAppDeviceFolder(request,folder);if(!dir){toast(T('folder_needed'));return false;}
    const previous=t.deviceFile?{...t.deviceFile}:null;
    const base=safeFolderPart(transcriptTitle(t),'transcript'),suffix=String(t.id||Date.now()).slice(-6),fileName=`${base}-${suffix}.txt`;
    const fh=await dir.getFileHandle(fileName,{create:true}),w=await fh.createWritable();await w.write(t.text||'');await w.close();
    let audioName=t.deviceFile&&t.deviceFile.audioName||'',audioBytes=t.deviceFile&&t.deviceFile.audioBytes||0;
    if(S.deviceSaveAudio&&sourceFile){const ext=(String(sourceFile.name||'').match(/\.[a-z0-9]{1,8}$/i)||['.audio'])[0];audioName=`${base}-${suffix}-audio${ext}`;
      const ah=await dir.getFileHandle(audioName,{create:true}),aw=await ah.createWritable();await aw.write(sourceFile);await aw.close();audioBytes=sourceFile.size||0;}
    if(previous&&previous.folder===folder){for(const old of [previous.name!==fileName?previous.name:'',previous.audioName&&previous.audioName!==audioName?previous.audioName:''].filter(Boolean)){try{await dir.removeEntry(old);}catch(e){}}}
    t.deviceFile={name:fileName,audioName,folder,savedAt:Date.now(),textBytes:new Blob([t.text||'']).size,audioBytes};persistTr();
    toast(S.deviceSaveAudio&&sourceFile?T('audio_saved'):S.deviceSaveAudio&&!audioName?T('audio_not_available'):T('saved_device'));return true;
  }catch(e){toast(T('folder_error'));return false;}
}
function saveTrToDevice(id){const t=findTr(id);if(t)writeTranscriptToDevice(t,true);}
async function deleteDeviceCopy(t){
  if(!t.deviceFile||!t.deviceFile.name)return true;
  try{const folder=t.deviceFile.folder||safeFolderPart(S.username,S.lang==='he'?'משתמש':'User');const dir=await getAppDeviceFolder(true,folder,false);if(!dir)return false;
    for(const name of [t.deviceFile.name,t.deviceFile.audioName].filter(Boolean)){try{await dir.removeEntry(name);}catch(e){if(!(e&&e.name==='NotFoundError'))throw e;}}return true;
  }catch(e){return !!(e&&e.name==='NotFoundError'&&t.deviceFile.folder);}
}
async function deviceFolderSize(){
  try{const folder=safeFolderPart(S.username,S.lang==='he'?'משתמש':'User'),dir=await getAppDeviceFolder(false,folder,false);if(!dir)return NaN;let total=0;
    for await(const entry of dir.values()){if(entry.kind==='file'){const f=await entry.getFile();total+=f.size||0;}}return total;
  }catch(e){return NaN;}
}

/* ---------- MY TRANSCRIPTS ---------- */
const mineState={q:'',sort:'new',type:'all',lang:'all',course:'all',favorite:'all',mode:'active',select:false,selected:new Set()};
function transcriptTitle(t){
  if(t.title) return t.title;
  if(t.name) return t.name.replace(/\.[^.]+$/,'');
  return (S.lang==='he'?'תמלול ':'Transcript ')+fmtDate(t.at);
}
function transcriptWords(t){ return (t.text||'').trim()?((t.text||'').trim().match(/\S+/g)||[]).length:0; }
function filteredTranscripts(){
  const q=mineState.q.trim().toLocaleLowerCase();
  const list=transcripts.filter(t=>(mineState.type==='all'||(mineState.type==='live'&&t.live)||(mineState.type==='file'&&!t.live))
    &&(mineState.lang==='all'||t.lang===mineState.lang)
    &&(mineState.course==='all'||(t.course||'')===mineState.course)
    &&(mineState.favorite==='all'||!!t.favorite)
    &&(!q||(transcriptTitle(t)+' '+(t.course||'')+' '+(t.notes||'')+' '+(t.text||'')).toLocaleLowerCase().includes(q)));
  return list.sort((a,b)=>mineState.sort==='old'?(a.at||0)-(b.at||0):mineState.sort==='name'
    ?transcriptTitle(a).localeCompare(transcriptTitle(b),S.lang):(b.at||0)-(a.at||0));
}

      <button class="btn sm" data-act="open" data-id="${esc(t.id)}">👁️ ${T('edit')}</button>

      <button class="btn sm danger" data-act="delete" data-id="${esc(t.id)}">🗑️ ${T('del')}</button>

function trashListHtml(){if(!trashItems.length)return `<div class="card center muted">${T('trash_empty')}</div>`;return [...trashItems].sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0)).map(t=>`<div class="tr"><div class="tr-title">🗑️ ${esc(transcriptTitle(t))}</div><div class="meta">${fmtDate(t.deletedAt||t.at)}</div><div class="snip">${esc((t.text||'').slice(0,180))}${(t.text||'').length>180?'…':''}</div><div class="acts"><button class="btn sm" data-trash-act="restore" data-id="${esc(t.id)}">↩️ ${T('restore_item')}</button><button class="btn sm danger" data-trash-act="purge" data-id="${esc(t.id)}">🗑️ ${T('delete_forever')}</button></div></div>`).join('');}

function wireMineActions(){
  const root=document.getElementById('mineList'); if(!root) return;
  root.querySelectorAll('.mine-check').forEach(c=>c.onchange=()=>{c.checked?mineState.selected.add(c.dataset.id):mineState.selected.delete(c.dataset.id);const n=document.getElementById('selectedCount');if(n)n.textContent=`${mineState.selected.size} ${T('selected_items')}`;});
  root.querySelectorAll('[data-trash-act]').forEach(b=>b.onclick=()=>b.dataset.trashAct==='restore'?restoreTrashItem(b.dataset.id):purgeTrashItem(b.dataset.id));
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ const id=b.dataset.id;
    if(b.dataset.act==='open') openTr(id); else if(b.dataset.act==='copy') copyTr(id);
    else if(b.dataset.act==='export') exportTr(id);else if(b.dataset.act==='markdown')exportMarkdownTr(id);else if(b.dataset.act==='share')shareTranscript(findTr(id));else if(b.dataset.act==='duplicate')duplicateTranscript(id);else if(b.dataset.act==='device') saveTrToDevice(id); else if(b.dataset.act==='delete') delTr(id); });
}
function renderMineList(){ const root=document.getElementById('mineList'); if(root){root.innerHTML=mineListHtml();wireMineActions();} }

  document.getElementById('showActive').onclick=()=>{mineState.mode='active';render();};document.getElementById('showTrash').onclick=()=>{mineState.mode='trash';mineState.select=false;mineState.selected.clear();render();};

function findTr(id){ return transcripts.find(t=>t.id===id); }
function copyTr(id){ const t=findTr(id); if(t){ navigator.clipboard.writeText(t.text); toast(T('copied')); } }
function exportTr(id){ const t=findTr(id); if(t) download((transcriptTitle(t)||'transcript').replace(/[\\/:*?"<>|]/g,'-')+'.txt',transcriptExportText(t),'text/plain'); }
function exportMarkdownTr(id){const t=findTr(id);if(t)download(safeFolderPart(transcriptTitle(t),'transcript')+'.md',transcriptMarkdown(t),'text/markdown');}
function moveManyToTrash(ids,message){const set=new Set(ids),moving=transcripts.filter(t=>set.has(t.id)).map(t=>({...t,deletedAt:Date.now()}));if(!moving.length)return;trashItems=[...moving,...trashItems.filter(t=>!set.has(t.id))];if(!persistTrash())return;transcripts=transcripts.filter(t=>!set.has(t.id));if(persistTr()&&message)toast(message);}
function removeTranscriptFromApp(id,message){moveManyToTrash([id],message||T('moved_trash'));go('mine');}
function restoreTrashItem(id){const t=trashItems.find(x=>x.id===id);if(!t)return;const restored={...t};delete restored.deletedAt;transcripts=[restored,...transcripts.filter(x=>x.id!==id)];if(!persistTr())return;trashItems=trashItems.filter(x=>x.id!==id);persistTrash();toast(T('restored_item'));render();}
function purgeTrashItem(id){confirmBox(T('permanent_q'),()=>{trashItems=trashItems.filter(t=>t.id!==id);delete revisions[id];persistTrash();persistRevisions();render();},T('delete_forever'));}
function showVersionHistory(id){const t=findTr(id);if(!t)return;const list=Array.isArray(revisions[id])?revisions[id]:[];modal(`<div class="h2">🕘 ${T('version_history')}</div>${list.length?list.map((v,i)=>`<div class="card"><b>${esc(v.title||T('previous_version'))}</b><div class="hint">${fmtDate(v.savedAt)} · ${transcriptWords(v)} ${T('words')}</div><div class="snip">${esc((v.text||'').slice(0,180))}${(v.text||'').length>180?'…':''}</div><button class="btn sm" data-rev="${i}">↩️ ${T('restore_version')}</button></div>`).join(''):`<p class="muted">${T('no_versions')}</p>`}<div class="row"><button class="btn ghost" onclick="closeModal()">${T('close')}</button>${list.length?`<button class="btn danger" id="clearHistory">${T('clear_versions')}</button>`:''}</div>`);document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>restoreRevision(id,Number(b.dataset.rev)));const clear=document.getElementById('clearHistory');if(clear)clear.onclick=()=>confirmBox(T('clear_versions_q'),()=>{delete revisions[id];persistRevisions();closeModal();},T('clear_versions'));}
function restoreRevision(id,index){const t=findTr(id),v=(revisions[id]||[])[index];if(!t||!v)return;captureRevision(t);Object.assign(t,{title:v.title,course:v.course,notes:v.notes,favorite:v.favorite,text:v.text,segments:v.segments,bookmarks:v.bookmarks||[],readingPosition:v.readingPosition||0,lang:v.lang,at:v.at,live:v.live,name:v.name});if(persistTr()){closeModal();toast(T('version_restored'));openTr(id);}}
function delTr(id){

    if(await deleteDeviceCopy(t)){t.deviceFile=null;closeModal();removeTranscriptFromApp(id,T('deleted_both'));}
    else{b.disabled=false;toast(T('delete_device_failed'));}};

async function getMicPermissionState(){

  catch(e){return 'unknown';}
}

async function requestMicrophonePermission(){

  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(T('unsupported'));return;}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());toast(T('granted'));}
  catch(err){if(err&&err.name==='NotAllowedError')showMicPermissionHelp();else toast(T('err'));}

function cleanString(v,max=2000000){ return typeof v==='string'?v.slice(0,max):''; }
function cleanSettings(raw){
  const a=raw&&typeof raw.ai==='object'&&raw.ai?raw.ai:{};
  const allowedProviders=['web','gem','oai','claude','custom'];
  const keys={},models={},connected={};
  const consent={};
  for(const id of allowedProviders){
    if(typeof (a.keys||{})[id]==='string') keys[id]=a.keys[id].slice(0,1000);
    if(typeof (a.models||{})[id]==='string') models[id]=a.models[id].slice(0,200);
    if(typeof (a.connected||{})[id]==='boolean') connected[id]=a.connected[id];
    if(typeof (a.consent||{})[id]==='boolean') consent[id]=a.consent[id];
  }
  return {
    username:cleanString(raw.username,200),
    lang:Object.prototype.hasOwnProperty.call(LANG,raw.lang)?raw.lang:'he',
    palette:Object.prototype.hasOwnProperty.call(PALETTES,raw.palette)?raw.palette:'goldblack',
    theme:raw.theme==='light'?'light':'dark',
    ai:{provider:allowedProviders.includes(a.provider)?a.provider:'web',keys,models,
      base:cleanString(a.base,1000),connected,consent,
      gemModels:Array.isArray(a.gemModels)?a.gemModels.filter(x=>typeof x==='string').slice(0,500).map(x=>x.slice(0,200)):[]},
    wantTs:!!raw.wantTs,
    wantSpeakers:!!raw.wantSpeakers,
    micEnabled:raw.micEnabled!==false,
    recordingMicId:cleanString(raw.recordingMicId,500),
    deviceSaveAuto:!!raw.deviceSaveAuto,
    deviceSaveAudio:!!raw.deviceSaveAudio,
    readerSize:['small','normal','large'].includes(raw.readerSize)?raw.readerSize:'normal',
    readerSpacing:['compact','comfortable','spacious'].includes(raw.readerSpacing)?raw.readerSpacing:'comfortable',
    highContrast:!!raw.highContrast,reduceMotion:!!raw.reduceMotion
  };
}

  return {text:cleanString(t.text),title:cleanString(t.title,500),course:cleanString(t.course,160),notes:cleanString(t.notes,20000),favorite:!!t.favorite,segments:segs,bookmarks,readingPosition:Math.max(0,Number(t.readingPosition)||0),lang:cleanString(t.lang,20),
    at:Number.isFinite(+t.at)?+t.at:Date.now(),live:!!t.live,name:cleanString(t.name,500),sourceFingerprint:cleanString(t.sourceFingerprint,1000),
    deviceFile:t.deviceFile&&typeof t.deviceFile==='object'?{name:cleanString(t.deviceFile.name,500),audioName:cleanString(t.deviceFile.audioName,500),folder:cleanString(t.deviceFile.folder,100),savedAt:Number.isFinite(+t.deviceFile.savedAt)?+t.deviceFile.savedAt:0,textBytes:Number.isFinite(+t.deviceFile.textBytes)?+t.deviceFile.textBytes:0,audioBytes:Number.isFinite(+t.deviceFile.audioBytes)?+t.deviceFile.audioBytes:0}:null,
    id:cleanString(t.id,100)||`${Date.now()}r${i}`};
}
function cleanRevisions(raw){const out={};if(!raw||typeof raw!=='object'||Array.isArray(raw))return out;for(const [id,list] of Object.entries(raw).slice(0,10000)){if(typeof id!=='string'||!Array.isArray(list))continue;out[id.slice(0,100)]=list.slice(0,5).map((v,i)=>{const x=cleanTranscript({...v,id:'revision'},i);delete x.id;delete x.deviceFile;x.savedAt=Number.isFinite(+v.savedAt)?+v.savedAt:Date.now();return x;});}return out;}
function parseBackup(text){
  const d=JSON.parse(text);
  if(!d||typeof d!=='object'||!Array.isArray(d.transcripts)||!d.settings||typeof d.settings!=='object') throw new Error('bad backup');
  if(d.app&&d.app!=='TimlulAI'&&d.app!=='Kolmus') throw new Error('wrong app');
  if(d.schemaVersion&&d.schemaVersion>4) throw new Error('unsupported version');
  if(d.transcripts.length>10000||(Array.isArray(d.trash)&&d.trash.length>10000)) throw new Error('too many transcripts');
  return {settings:cleanSettings(d.settings),transcripts:d.transcripts.map(cleanTranscript),trash:(Array.isArray(d.trash)?d.trash:[]).map((t,i)=>({...cleanTranscript(t,i),deletedAt:Number.isFinite(+t.deletedAt)?+t.deletedAt:Date.now()})),revisions:cleanRevisions(d.revisions),
    secretsIncluded:!!d.secretsIncluded||!!(d.settings.ai&&d.settings.ai.keys&&Object.keys(d.settings.ai.keys).length)};
}
function commitRestore(data,mode){
  const oldSettings=store.get(PFX+'settings'),oldTranscripts=store.get(PFX+'transcripts'),oldTrash=store.get(PFX+'trash'),oldRevisions=store.get(PFX+'revisions');
  const nextSettings=mode==='merge'?JSON.parse(JSON.stringify(S)):data.settings;
  if(mode!=='merge'&&!data.secretsIncluded){ nextSettings.ai.keys={...((S.ai&&S.ai.keys)||{})}; nextSettings.ai.connected={...((S.ai&&S.ai.connected)||{})}; }
  const merged=mode==='merge'
    ? [...data.transcripts,...transcripts].filter((t,i,a)=>a.findIndex(x=>x.id===t.id)===i)
    : data.transcripts;
  const mergedTrash=mode==='merge'?[...data.trash,...trashItems].filter((t,i,a)=>a.findIndex(x=>x.id===t.id)===i):data.trash;
  const mergedRevisions=mode==='merge'?{...revisions,...data.revisions}:data.revisions;
  try{
    localStorage.setItem(PFX+'settings',JSON.stringify(nextSettings));
    localStorage.setItem(PFX+'transcripts',JSON.stringify(merged));
    localStorage.setItem(PFX+'trash',JSON.stringify(mergedTrash));
    localStorage.setItem(PFX+'revisions',JSON.stringify(mergedRevisions));
    if(!localStorage.getItem(PFX+'settings')||!localStorage.getItem(PFX+'transcripts')||!localStorage.getItem(PFX+'trash')||!localStorage.getItem(PFX+'revisions')) throw new Error('verify failed');
    S=nextSettings; transcripts=merged;trashItems=mergedTrash;revisions=mergedRevisions; return true;
  }catch(err){
    try{
      oldSettings==null?localStorage.removeItem(PFX+'settings'):localStorage.setItem(PFX+'settings',oldSettings);
      oldTranscripts==null?localStorage.removeItem(PFX+'transcripts'):localStorage.setItem(PFX+'transcripts',oldTranscripts);
      oldTrash==null?localStorage.removeItem(PFX+'trash'):localStorage.setItem(PFX+'trash',oldTrash);
      oldRevisions==null?localStorage.removeItem(PFX+'revisions'):localStorage.setItem(PFX+'revisions',oldRevisions);
    }catch(e){}
    return false;
  }
}
function restorePreview(data){
  modal(`<div class="h2">${T('restore_found')}: ${data.transcripts.length} ${T('restore_items')}</div>
    <p class="hint">${T('restore_note')}</p>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="restoreCancel">${T('cancel')}</button>
      <button class="btn sm" id="restoreMerge">${T('restore_merge')}</button>
      <button class="btn danger" id="restoreReplace">${T('restore_replace')}</button>
    </div>`);
  document.getElementById('restoreCancel').onclick=closeModal;
  const apply=mode=>{
    doBackup(false,`timlulai-before-restore-${new Date().toISOString().replace(/[:.]/g,'-')}.json`);
    if(commitRestore(data,mode)){ closeModal(); go('home'); toast(T('restore_done')); }
    else { closeModal(); toast(T('restore_failed')); }
  };
  document.getElementById('restoreMerge').onclick=()=>apply('merge');
  document.getElementById('restoreReplace').onclick=()=>apply('replace');
}
function doRestore(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  if(f.size>25*1048576){ toast(T('restore_large')); return; }
  const r=new FileReader();
  r.onload=()=>{ try{ restorePreview(parseBackup(r.result)); }catch(err){ toast(T('restore_bad')); } };
  r.onerror=()=>toast(T('restore_bad'));
  r.readAsText(f);
}

    if(mEl) S.ai.models[id]=mEl.value;
    if(bEl) S.ai.base=bEl.value.trim();
    if(persist()) toast(T('saved'));
  };
  const rf=document.getElementById('cfgRefresh');
  if(rf) rf.onclick=()=>{ if(kEl) S.ai.keys.gem=kEl.value.trim(); persist(); refreshGeminiModels(); };
  document.getElementById('cfgDisc').onclick=()=>{ delete S.ai.keys[id]; if(S.ai.connected) delete S.ai.connected[id]; if(S.ai.consent) delete S.ai.consent[id];
    persist(); go('ai'); };
  document.getElementById('cfgTest').onclick=async()=>{
    const st=document.getElementById('cfgStatus'); st.textContent=T('testing');
    if(kEl) S.ai.keys[id]=kEl.value.trim(); if(mEl) S.ai.models[id]=mEl.value; if(bEl) S.ai.base=bEl.value.trim(); persist();
    try{ await testProvider(id); S.ai.connected=S.ai.connected||{}; S.ai.connected[id]=true; persist();
      st.innerHTML=`🟢 ${T('connected')}`; }
    catch(err){ S.ai.connected&&(S.ai.connected[id]=false); persist(); st.innerHTML=`🔴 ${esc((err.message||'').slice(0,120))}`; }

async function testProvider(id){
  if(id==='gem'){ return callChat('gem','Reply with: ok'); }
  if(id==='claude'){ return callChat('claude','Reply with: ok'); }
  if(id==='oai'){ const r=await fetch('https://api.openai.com/v1/models',{headers:{'Authorization':'Bearer '+S.ai.keys.oai}});
    if(!r.ok) throw new Error('OpenAI '+r.status); return true; }
  if(id==='custom'){ const base=safeBaseUrl(S.ai.base||''); const r=await fetch(base+'/v1/models',
    {headers: S.ai.keys.custom?{'Authorization':'Bearer '+S.ai.keys.custom}:{}}); if(!r.ok) throw new Error('HTTP '+r.status); return true; }
}
async function refreshGeminiModels(){
  const key=S.ai.keys.gem; const st=document.getElementById('cfgStatus');
  if(!key){ toast(T('need_key')); return; }
  if(st) st.textContent=T('testing');
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});
    if(!r.ok) throw new Error('HTTP '+r.status+': '+(await r.text()).slice(0,80));
    const d=await r.json();
    const list=(d.models||[])
      .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>(m.name||'').replace(/^models\//,''))
      .filter(n=>/gemini/i.test(n) && !/embedding|aqa/i.test(n));
    if(!list.length) throw new Error('empty');
    S.ai.gemModels=list;
    if(!list.includes(S.ai.models.gem)) S.ai.models.gem = list.find(n=>/3\.6-flash/.test(n)) || list.find(n=>/flash/.test(n)) || list[0];
    persist(); showProvConfig('gem');
    const st2=document.getElementById('cfgStatus');
    if(st2) st2.innerHTML=`🟢 ${(S.lang==='he'?'נמצאו ':'Found ')}${list.length}${(S.lang==='he'?' מודלים זמינים':' available models')}`;
  }catch(e){ if(st) st.innerHTML=`🔴 ${esc((e.message||'').slice(0,100))}`; }
}
